<body>

    <h1>Formulario de Contacto</h1>

    <form id="contactoForm">

        <label for="nombre">Nombre (máximo 20 caracteres):</label>

        <input type="text" id="nombre" name="nombre" maxlength="20" required>

        

        <br>

        <label for="apellido">Apellido (máximo 20 caracteres) :</label>

        <input type="text" id="apellido" name="apellido" maxlength="20" required>

        <br>

        

        <label for="email">Email:</label>

        <input type="email" id="email" name="email" required>

        <br>

        <label for="telefono">Teléfono:</label>

        <input type="tel" id="telefono" name="telefono" placeholder="ejemplo: 111-234-5678" onfocus="this.placeholder = ''">

        <br>

        <label for="edad">Edad mínimo 16 y máximo 120 años:</label>

        <input type="number" id="edad" name="edad" min="16" max="120">

        <br>

        <label for="direccion">Dirección:</label>

        <textarea id="direccion" name="direccion"></textarea>

        <br>

        <label for="provincia">Provincia:</label>

        <input type="text" id="provincia" name="provincia" list="provincias">

        <datalist id="provincias">

            <option value="Neuquén">

            <option value="Río Negro">

            <option value="Chubut">

            <option value="Santa Cruz">

            <option value="Tierra del Fuego">

        </datalist>

        <br>

        <label for="codigoPostal">Código Postal (A1234ABC):</label>

        <input type="text" id="codigoPostal" name="codigoPostal" pattern="[A-Z]\d{4}[A-Z]{3}">

        <form>
        
<head>
         <style>
            .opciones {
                display: flex;
                flex-direction: column;
            }
            .opciones label {
                display: flex;
                align-items: center;
            }
            .opciones input[type="radio"],
            .opciones input[type="checkbox"] {
                margin-right: 10px;
            }
         </style>

<head>

            <style>
             .opciones {
  display: flex;
  flex-direction: column;
  margin-bottom: 10px; /* Espacio entre grupos de opciones */
}

.opciones label {
  display: flex;
  align-items: center;
  margin-bottom: 5px;
}

.opciones input[type="radio"],
.opciones input[type="checkbox"] {
  margin-right: 10px;
}
            </style>
</head>

<div class="opciones">
  <label>
    Correo electrónico <input type="radio" name="contacto" value="email" checked>
  </label>
  <label>
    Correo postal <input type="radio" name="contacto" value="postal">
  </label>
  <label>
    Teléfono <input type="radio" name="contacto" value="telefono">
  </label>
</div>

<div class="opciones">
  <label>
    Noticias <input type="checkbox" name="suscripcion" value="noticias">
  </label>
  <label>
    Promociones <input type="checkbox" name="suscripcion" value="promociones">
  </label>
  <label>
    Alertas <input type="checkbox" name="suscripcion" value="alertas" checked>
  </label>
  <label>
    Eventos <input type="checkbox" name="suscripcion" value="eventos">
  </label>

       
</div>
        <button type="submit">Cargar</button>
    </form>
